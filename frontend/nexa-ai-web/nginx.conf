# =====================================================================
# NGINX configuration for the nexa-ai-web container.
#
# This serves the built frontend and proxies /api to the API Gateway. It is a
# separate file from infrastructure/docker/nginx/nexaai.conf because this image
# is built from frontend/nexa-ai-web while the gateway-facing edge proxy is part
# of the infrastructure tier.
#
# NOTE: the `upstream api-gateway` below only resolves inside the Compose
# network, and the gateway does not exist until Phase 3. This image therefore
# cannot serve /api yet. See docs/MEMORY.md section 6.1.
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded documents are capped by document-service against the user's plan.
    # NGINX rejects absurd bodies early so a large upload never becomes a slow
    # request that ties up a connection.
    client_max_body_size 25m;

    # Do not advertise the NGINX version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # --- security headers ---------------------------------------------------
    # The full set from docs/SECURITY.md section 10, except CSP, which is
    # deliberately deferred until Phase 10 settles the real policy. A wrong CSP
    # in Phase 0 would break the application in a way that looks like a bug.
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                     always;

    # =====================================================================
    # API: everything under /api goes to the gateway, and only to the gateway.
    #
    # There is no location block pointing at auth-service, chat-service or any
    # other service. The frontend must never call a service port directly, so
    # there is exactly one upstream and one place where edge policy lives.
    # =====================================================================
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The gateway generates this when absent; forwarding preserves it.
        proxy_set_header X-Correlation-Id  $http_x_correlation_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # =====================================================================
    # Server-Sent Events: streamed chat answers.
    #
    # This block is the difference between a working chat and a broken one.
    # With buffering on, NGINX holds every token until the answer completes and
    # the user sees nothing, then sees it all at once. Buffering must be off,
    # chunked transfer must stay on, and the read timeout must exceed the
    # longest generation a provider can take.
    # =====================================================================
    location ~ ^/api/v1/chat/.*/messages$ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id  $http_x_correlation_id;

        # Stream the response through untouched, token by token.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;

        # A long generation is normal, so a generous ceiling is correct here and
        # only here.
        proxy_connect_timeout 5s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    # --- static assets ------------------------------------------------------
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading an
    # old bundle that points at assets which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # --- SPA fallback -------------------------------------------------------
    # Client-side routing: any unknown path that is not an API call and not a
    # real file returns index.html so the router can resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Internal service endpoints are never reachable from outside. The gateway
    # refuses these too; this is the second, independent lock.
    location ~ ^/(internal|actuator)/ {
        deny all;
        return 404;
    }
}