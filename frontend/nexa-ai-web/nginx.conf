# =====================================================================
# NGINX configuration for the nexa-ai-web container.
#
# This is the copy that is baked into the frontend image. It serves the built
# bundle and proxies /api to the API Gateway. The infrastructure-tier proxy,
# which additionally applies the rate-limit zones, lives at
# infrastructure/docker/nginx/nexaai.conf.
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"  always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # API traffic goes to the gateway only. The frontend never calls a service
    # port directly, so there is no location block pointing at any service.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Server-Sent Events must not be buffered, or a streamed answer arrives all
    # at once at the end instead of token by token.
    location ~ ^/api/v1/chat/.*/messages$ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 5s;
        proxy_read_timeout    600s;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers requesting an
    # old bundle that points at assets which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Internal service endpoints are never reachable from outside. The gateway
    # refuses these too; this is the second, independent lock.
    location ~ ^/(internal|actuator)/ {
        deny all;
        return 404;
    }
}
