server:
  port: 8087

spring:
  datasource:
    url: jdbc:h2:mem:nexa_subscription;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

razorpay:
  mode: test
  key-id: ${RAZORPAY_KEY_ID:rzp_test_nexaai_default}
  key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_secret_default}
