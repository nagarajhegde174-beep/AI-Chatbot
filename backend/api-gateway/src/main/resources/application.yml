spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # One route per owning service. No prefix is stripped, so a downstream service
          # always receives exactly the path the client sent and owns its own namespace.
          # Upstream URLs come from the environment so the same image works locally and
          # in Docker Compose (docs/ARCHITECTURE.md, Docker architecture).
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/users/**,/api/v1/admin/users/**
            - id: chat-service
              uri: ${CHAT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/chat/**
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/ai/**
            - id: document-service
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/documents/**
            - id: rag-service
              uri: ${RAG_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/rag/**
            - id: subscription-service
              uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/subscriptions/**,/api/v1/admin/plans/**
          httpclient:
            # Chat answers are streamed as Server-Sent Events. The default 5s response
            # timeout would cut a long generation off mid-answer.
            connect-timeout: 2000
            response-timeout: 300s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.nexaai: INFO
    org.springframework.cloud.gateway: INFO

# ---------------------------------------------------------------------------
# Phase 0 note: no datasource, no Kafka, no security chain. The gateway is a
# pure router in this phase. Token verification, rate limiting and the
# /internal/v1/** allow-list are Phase 2 work, see docs/TASKS.md.
# ---------------------------------------------------------------------------
