server:
  port: 0

spring:
  cloud:
    gateway:
      routes:
        - id: test-auth-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: test-user-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**

jwt:
  verifier:
    issuer: nexa-auth-service
    audience: nexaai-web

rate-limit:
  enabled: false
