server:
  port: 0

spring:
  application:
    name: auth-service-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:nexa_auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

auth:
  jwt:
    issuer: nexa-auth-service
    audience: nexaai-web
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
  cookie:
    name: refresh_token
    secure: false
    same-site: Lax
    path: /
  lockout:
    max-attempts: 5
    lockout-duration-minutes: 15
  email:
    verification-expiration-hours: 24
    reset-expiration-minutes: 15

springdoc:
  api-docs:
    enabled: false
