spring:
  application:
    name: rag-service

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.nexaai: INFO

# ---------------------------------------------------------------------------
# Phase 0 note: no datasource is configured on purpose. The pgvector schema and
# Flyway migrations for nexa_rag land in the RAG phase. RAG_DB_URL and friends
# arrive through environment variables.
# ---------------------------------------------------------------------------