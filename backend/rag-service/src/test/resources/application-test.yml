server:
  port: 0

spring:
  application:
    name: rag-service-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  datasource:
    url: jdbc:h2:mem:nexa_rag;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false

nexa:
  rag:
    default-top-k: 5
    default-min-score: 0.1
    embedding-model: text-embedding-3-small
  jwt:
    issuer: nexa-auth-service
    audience: nexaai-web
    public-key: ""
