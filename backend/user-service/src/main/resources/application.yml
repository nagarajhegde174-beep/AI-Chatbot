server:
  port: ${USER_SERVICE_PORT:8082}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/nexa_user
    username: ${POSTGRES_USER:nexa_user}
    password: ${POSTGRES_PASSWORD:nexa_user_local_pw}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_USER_GROUP_ID:nexa.user-service.events}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.nexaai.user.*"
        spring.json.use.type.headers: false
        auto.offset.reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    properties:
      request.timeout.ms: 5000
      max.block.ms: 3000

# Auth service internal base URL (for account status lookups if needed)
services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

# JWT verification (same issuer/audience as auth-service)
app:
  jwt:
    issuer: nexa-auth-service
    audience: nexaai-web
    jwks-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
    # Inline public key for local dev (auto-fetched from auth-service JWKS in production)
    public-key: ${JWT_PUBLIC_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
