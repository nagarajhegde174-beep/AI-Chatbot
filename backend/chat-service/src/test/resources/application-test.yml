server:
  port: 0

spring:
  application:
    name: chat-service-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:h2:mem:nexa_chat;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false

services:
  user:
    base-url: http://localhost:8082
  ai:
    base-url: http://localhost:8084

app:
  jwt:
    issuer: nexa-auth-service
    audience: nexaai-web
    jwks-uri: http://localhost:8081/.well-known/jwks.json
    public-key: ""

# Phase 5 — use placeholder AI client in tests (no AI Service needed)
nexa:
  ai-client:
    mode: placeholder
  memory:
    max-context-tokens: 6000
    recent-window-size: 10
    summarization-threshold: 20
