server:
  port: ${CHAT_SERVICE_PORT:8083}

spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/nexa_chat
    username: ${POSTGRES_USER:nexa_chat}
    password: ${POSTGRES_PASSWORD:nexa_chat_local_pw}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_CHAT_GROUP_ID:nexa.chat-service.events}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.nexaai.chat.*"

# External service URLs (for REST communication)
services:
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8082}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8084}

# JWT verification (same issuer/audience as auth-service)
app:
  jwt:
    issuer: nexa-auth-service
    audience: nexaai-web
    jwks-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
    public-key: ${JWT_PUBLIC_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Phase 5: Conversation Memory ──────────────────────────────────────────────
nexa:
  # "live"        → calls real AI Service (default when AI Service is running)
  # "placeholder" → returns stub responses (for local dev without AI Service)
  ai-client:
    mode: ${AI_CLIENT_MODE:live}

  memory:
    # Hard token cap for the full context window sent to the model (excl. new turn)
    max-context-tokens: ${MEMORY_MAX_CONTEXT_TOKENS:6000}
    # Number of recent message turns (user+assistant pairs) to always keep verbatim
    recent-window-size: ${MEMORY_RECENT_WINDOW_SIZE:10}
    # Un-summarized message count that triggers a compression pass
    summarization-threshold: ${MEMORY_SUMMARIZATION_THRESHOLD:20}
