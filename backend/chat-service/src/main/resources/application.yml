server:
  port: ${CHAT_SERVICE_PORT:8083}

spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/nexa_chat
    username: ${POSTGRES_USER:nexa_chat}
    password: ${POSTGRES_PASSWORD:nexa_chat_local_pw}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# External service URLs (for REST communication)
services:
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8082}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8084}

# JWT verification (same issuer/audience as auth-service)
app:
  jwt:
    issuer: nexa-auth-service
    audience: nexaai-web
    jwks-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
    public-key: ${JWT_PUBLIC_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
