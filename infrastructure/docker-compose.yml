# =====================================================================
# NexaAI local development stack.
#
#   docker compose --profile infra up -d      infrastructure only
#   docker compose --profile backend up -d    the eight services
#   docker compose --profile frontend up -d   the web client
#   docker compose up -d                      everything
#
# The profiles exist so a backend developer can run Postgres, Redis and Kafka
# without paying the cost of eight JVMs, and so a frontend developer needs
# nothing but the gateway.
#
# ARCHITECTURE, not a monolith: every backend entry below is a separate image
# built from its own directory, with its own port and its own credentials.
# =====================================================================

name: nexaai

networks:
  # Internal network. Nothing is published except where a port mapping
  # explicitly says so, and those exist for local development only.
  nexa-internal:
    driver: bridge

volumes:
  nexa-postgres-data:
  nexa-redis-data:
  nexa-kafka-data:
  nexa-document-files:

# ---------------------------------------------------------------------
# Shared service defaults.
#
# This extension field holds NO secrets and NO database credentials: it is
# only the shared bootstrap address, so the Kafka and Redis endpoints are
# written once. Every service then overrides `environment` with its own
# values, adding only what it needs.
# ---------------------------------------------------------------------
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [nexa-internal]

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: local
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-infra-depends: &infra-depends
  kafka:
    condition: service_healthy
  redis:
    condition: service_healthy

x-data-depends: &data-depends
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  redis:
    condition: service_healthy

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  # ---------------------------------------------------------------- postgres --
  # The pgvector build of PostgreSQL, because the RAG Service needs the vector
  # extension. One container, but one DATABASE AND ONE ROLE per service, each
  # granted on exactly one database. The AI Service and the API Gateway own no
  # database and have no role.
  #
  # Roles and grants: infrastructure/docker/postgres/init/01-create-databases.sql
  postgres:
    profiles: [infra, backend, frontend]
    image: pgvector/pgvector:pg17
    container_name: nexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-nexa_admin_local_pw}
      POSTGRES_DB: nexa_admin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexa-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/verify:/verify:ro
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      # Makes a missing index obvious during development rather than weeks later.
      - -c
      - log_min_duration_statement=200
      - -c
      - log_duration=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa_admin -d nexa_admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [nexa-internal]

  # ------------------------------------------------------------------- redis --
  # Cache, rate-limit counters, denylist, short-lived locks. Never the system of
  # record, so persistence is deliberately off.
  redis:
    profiles: [infra, backend]
    image: redis:7-alpine
    container_name: nexa-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [nexa-internal]

  # ------------------------------------------------------------------- kafka --
  # KRaft mode. The broker is its own controller.
  #
  # There is NO ZooKeeper service in this file, and there must never be one.
  # ZooKeeper is prohibited by docs/RULES.md section 4. Adding a zookeeper
  # service here must fail the build.
  kafka:
    profiles: [infra, backend]
    image: apache/kafka:4.1.0
    container_name: nexa-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: "1"
      # A combined broker+controller node: the recommended single-node KRaft setup.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Internal listener for services, external listener for host tooling only.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      # Single-node development values. These MUST be raised in a real deployment;
      # see infrastructure/docker/kafka/README.md.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - nexa-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [nexa-internal]

  # ===========================================================================
  # BACKEND — eight independent Spring Boot applications
  # ===========================================================================
  #
  # Every service below receives ONLY the values it needs:
  #
  #   SPRING_DATASOURCE_URL/USERNAME/PASSWORD  that service's own database.
  #     There is no shared username and no shared database, so a service
  #     physically cannot reach another service's data even if it tried.
  #   KAFKA_BOOTSTRAP_SERVERS                  the internal Kafka listener.
  #   REDIS_HOST                               the cache, never a source of truth.
  #   *_API_KEY / *_SECRET                     provider credentials, never committed.
  #

  # ------------------------------------------------------------ api-gateway --
  # Pure edge: no database, no Kafka, no Redis. It only routes.
  api-gateway:
    <<: *service-defaults
    profiles: [backend, frontend]
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
    image: nexaai/api-gateway:0.0.1-SNAPSHOT
    container_name: nexa-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CHAT_SERVICE_URL: http://chat-service:8083
      AI_SERVICE_URL: http://ai-service:8084
      DOCUMENT_SERVICE_URL: http://document-service:8085
      RAG_SERVICE_URL: http://rag-service:8086
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8087
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ----------------------------------------------------------- auth-service --
  # Owns nexa_auth and nothing else. The only service that knows a password.
  auth-service:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    image: nexaai/auth-service:0.0.1-SNAPSHOT
    container_name: nexa-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_auth
      SPRING_DATASOURCE_USERNAME: nexa_auth
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-nexa_auth_local_pw}
      # Path to the RS256 private key, mounted from outside the repository.
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-}
      JWT_ISSUER: nexa-auth-service
      JWT_AUDIENCE: nexaai-web
      JWT_ACCESS_TOKEN_TTL_SECONDS: "900"
    depends_on: *data-depends

  # ----------------------------------------------------------- user-service --
  # Owns nexa_user. It never stores a password; it learns of new accounts from
  # the auth.user.registered.v1 event.
  user-service:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/user-service
      dockerfile: Dockerfile
    image: nexaai/user-service:0.0.1-SNAPSHOT
    container_name: nexa-user-service
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_user
      SPRING_DATASOURCE_USERNAME: nexa_user
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-nexa_user_local_pw}
      JWT_ISSUER: nexa-auth-service
      JWT_AUDIENCE: nexaai-web
    depends_on: *data-depends

  # ----------------------------------------------------------- chat-service --
  # Owns nexa_chat. Orchestrates conversation memory, retrieval and the AI
  # Service, and relays the streamed answer to the browser.
  chat-service:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/chat-service
      dockerfile: Dockerfile
    image: nexaai/chat-service:0.0.1-SNAPSHOT
    container_name: nexa-chat-service
    ports:
      - "${CHAT_SERVICE_PORT:-8083}:8083"
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_chat
      SPRING_DATASOURCE_USERNAME: nexa_chat
      SPRING_DATASOURCE_PASSWORD: ${CHAT_DB_PASSWORD:-nexa_chat_local_pw}
      AI_SERVICE_URL: http://ai-service:8084
      RAG_SERVICE_URL: http://rag-service:8086
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8087
    depends_on: *data-depends

  # ------------------------------------------------------------- ai-service --
  # STATELESS. No datasource, no database, no volume. The only service that
  # holds model-provider credentials, and they come from the environment, never
  # from the image.
  ai-service:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile
    image: nexaai/ai-service:0.0.1-SNAPSHOT
    container_name: nexa-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8084}:8084"
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on: *infra-depends

  # ------------------------------------------------------- document-service --
  # Owns nexa_document and the binary file volume. Produces chunks; never
  # embeds them, which is the RAG Service's job.
  document-service:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/document-service
      dockerfile: Dockerfile
    image: nexaai/document-service:0.0.1-SNAPSHOT
    container_name: nexa-document-service
    ports:
      - "${DOCUMENT_SERVICE_PORT:-8085}:8085"
    volumes:
      - nexa-document-files:/var/lib/nexa/documents
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_document
      SPRING_DATASOURCE_USERNAME: nexa_document
      SPRING_DATASOURCE_PASSWORD: ${DOCUMENT_DB_PASSWORD:-nexa_document_local_pw}
      DOCUMENT_STORAGE_PATH: /var/lib/nexa/documents
    depends_on: *data-depends

  # ------------------------------------------------------------ rag-service --
  # Owns nexa_rag and is the ONLY service that loads the pgvector extension.
  rag-service:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/rag-service
      dockerfile: Dockerfile
    image: nexaai/rag-service:0.0.1-SNAPSHOT
    container_name: nexa-rag-service
    ports:
      - "${RAG_SERVICE_PORT:-8086}:8086"
    environment:
      <<: *service-env
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_rag
      SPRING_DATASOURCE_USERNAME: nexa_rag
      SPRING_DATASOURCE_PASSWORD: ${RAG_DB_PASSWORD:-nexa_rag_local_pw}
      # Embedding credentials. The RAG Service embeds; the AI Service generates.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on: *data-depends

  # ----------------------------------------------------- subscription-service --
  # Owns nexa_subscription. Razorpay is TEST MODE ONLY: RAZORPAY_MODE is pinned
  # to `test` and the service refuses to start if it is anything else. There is
  # no live-mode variable anywhere in this repository.
  subscription-service:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/subscription-service
      dockerfile: Dockerfile
    image: nexaai/subscription-service:0.0.1-SNAPSHOT
    container_name: nexa-subscription-service
    ports:
      - "${SUBSCRIPTION_SERVICE_PORT:-8087}:8087"
    environment:
      <<: *service-env
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_subscription
      SPRING_DATASOURCE_USERNAME: nexa_subscription
      SPRING_DATASOURCE_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:-nexa_subscription_local_pw}
      RAZORPAY_MODE: test
      RAZORPAY_TEST_KEY_ID: ${RAZORPAY_TEST_KEY_ID:-}
      RAZORPAY_TEST_KEY_SECRET: ${RAZORPAY_TEST_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on: *data-depends

  # ===========================================================================
  # FRONTEND
  # ===========================================================================
  frontend:
    profiles: [frontend]
    build:
      context: ../frontend/nexa-ai-web
      dockerfile: Dockerfile
      args:
        # Public value only. No key, no secret, no payment credential.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: nexaai/nexa-ai-web:0.0.1-SNAPSHOT
    container_name: nexa-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    networks: [nexa-internal]
    depends_on:
      api-gateway:
        condition: service_started

  # ===========================================================================
  # EDGE PROXY
  # ===========================================================================
  # Optional: NGINX with the rate-limit zones and the security headers from
  # infrastructure/docker/nginx/nexaai.conf. Use this profile to exercise the
  # real ingress path locally. The frontend container already proxies /api.
  edge:
    profiles: [frontend]
    image: nginx:1.27-alpine
    container_name: nexa-edge
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8089}:80"
    volumes:
      - ./docker/nginx/nexaai.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [nexa-internal]
    depends_on:
      api-gateway:
        condition: service_started
