# =====================================================================
# NexaAI local development infrastructure.
#
#   docker compose --profile infra up -d      infrastructure only
#   docker compose up -d                      everything that exists
#
# =====================================================================
#  PHASE 2 SCOPE.
#
#  This file starts PostgreSQL, Redis and Kafka, plus an optional NGINX edge,
#  and defines the backend services that exist as of Phase 2: auth-service,
#  user-service and api-gateway.
#
#  The other five services are added in their own phases, as each is
#  implemented. A commented-out service block would look like configuration, and
#  the first person to uncomment it would be running an image that does not
#  exist. See docs/ARCHITECTURE.md decision 015 and docs/RULES.md section 10.
# =====================================================================
#
# ARCHITECTURE, not a monolith: every backend entry is a separate image built
# from its own directory, with its own port and its own database credentials.
#
# There is NO ZooKeeper service in this file, and there must never be one.
# Kafka runs in KRaft mode. ZooKeeper is prohibited by docs/RULES.md section 4.
# =====================================================================

name: nexaai

networks:
  # Internal network. Nothing is published except where a port mapping
  # explicitly says so, and those exist for local development only.
  nexa-internal:
    driver: bridge

volumes:
  nexa-postgres-data:
  nexa-redis-data:
  nexa-kafka-data:

# ---------------------------------------------------------------------
# Shared service defaults.
#
# This extension field holds NO secrets and NO database credentials: it is only
# the shared bootstrap address, so the Kafka and Redis endpoints are written
# once. Every service overrides `environment` with its own values, adding only
# what it needs.
# ---------------------------------------------------------------------
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [nexa-internal]

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: local
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-infra-depends: &infra-depends
  kafka:
    condition: service_healthy

services:
  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  # ---------------------------------------------------------------- postgres --
  # The pgvector build of PostgreSQL, because the RAG Service needs the vector
  # extension. One container, but one DATABASE AND ONE ROLE per service, each
  # granted on exactly one database. The AI Service and the API Gateway own no
  # database and have no role.
  #
  # Roles and grants: infrastructure/docker/postgres/init/01-create-databases.sql
  # Isolation proof:     infrastructure/docker/postgres/verify/02-verify-ownership.sql
  postgres:
    profiles: [infra]
    image: pgvector/pgvector:pg17
    container_name: nexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-nexa_admin_local_pw}
      POSTGRES_DB: nexa_admin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexa-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/verify:/verify:ro
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      # Makes a missing index obvious during development rather than weeks later.
      - -c
      - log_min_duration_statement=200
      - -c
      - log_duration=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa_admin -d nexa_admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [nexa-internal]

  # ------------------------------------------------------------------- redis --
  # Cache, rate-limit counters, denylist, short-lived locks. Never the system of
  # record, so persistence is deliberately off.
  redis:
    profiles: [infra]
    image: redis:7-alpine
    container_name: nexa-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [nexa-internal]

  # ------------------------------------------------------------------- kafka --
  # KRaft mode. The broker is its own controller.
  #
  # There is NO ZooKeeper service in this file, and there must never be one.
  # ZooKeeper is prohibited by docs/RULES.md section 4. Adding a zookeeper
  # service here must fail the build.
  kafka:
    profiles: [infra]
    image: apache/kafka:4.1.0
    container_name: nexa-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: "1"
      # A combined broker+controller node: the recommended single-node KRaft setup.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Internal listener for services, external listener for host tooling only.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      # Single-node development values. These MUST be raised in a real deployment;
      # see infrastructure/docker/kafka/README.md and docs/SECURITY.md section 13.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - nexa-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [nexa-internal]

  # ===========================================================================
  # BACKEND
  # ===========================================================================
  #
  # Every service below receives ONLY the values it needs:
  #
  #   SPRING_DATASOURCE_URL/USERNAME/PASSWORD  that service's own database.
  #     There is no shared username and no shared database, so a service
  #     physically cannot reach another service's data even if it tries.
  #   KAFKA_BOOTSTRAP_SERVERS                  the internal Kafka listener.
  #   REDIS_HOST                               the cache, never a source of truth.
  #   *_API_KEY / *_SECRET                     provider credentials, never committed.

  # ----------------------------------------------------------- auth-service --
  # Owns nexa_auth and nothing else. The only service that knows a password.
  auth-service:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    image: nexaai/auth-service:0.1.0-SNAPSHOT
    container_name: nexa-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      # nexa_auth and nothing else. The role is granted on exactly one database,
      # so a cross-service query fails with a permission error rather than
      # quietly succeeding (docs/RULES.md section 3).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_auth
      SPRING_DATASOURCE_USERNAME: nexa_auth
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-nexa_auth_local_pw}
      NEXA_AUTH_FRONTEND_BASE_URL: ${NEXA_AUTH_FRONTEND_BASE_URL:-http://localhost:5173}
      # RS256 keys, supplied by the environment and never baked in. The empty
      # defaults make the service fail at startup with a clear message rather
      # than start insecurely (docs/RULES.md section 6).
      NEXA_AUTH_JWT_PRIVATE_KEY: ${NEXA_AUTH_JWT_PRIVATE_KEY:-}
      NEXA_AUTH_JWT_PUBLIC_KEY: ${NEXA_AUTH_JWT_PUBLIC_KEY:-}
      NEXA_AUTH_JWT_ISSUER: ${NEXA_AUTH_JWT_ISSUER:-nexa-auth-service}
      NEXA_AUTH_JWT_AUDIENCE: ${NEXA_AUTH_JWT_AUDIENCE:-nexaai-web}
      # Cookie Secure is true, and must be everywhere except local HTTP.
      NEXA_AUTH_COOKIE_SECURE: ${NEXA_AUTH_COOKIE_SECURE:-true}
      NEXA_AUTH_COOKIE_SAME_SITE: ${NEXA_AUTH_COOKIE_SAME_SITE:-Strict}
      # Google sign-in is off unless credentials are supplied.
      NEXA_AUTH_GOOGLE_ENABLED: ${NEXA_AUTH_GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on: *data-depends

  # ----------------------------------------------------------- user-service --
  # Owns nexa_user and nothing else. Knows no password and holds no hash.
  #
  # Its role is granted on nexa_user alone, so it cannot read nexa_auth: a
  # cross-service query fails with a permission error rather than quietly
  # succeeding (docs/RULES.md section 3). It learns that an account exists from
  # auth.user.registered.v1 and verifies tokens with the PUBLIC key only.
  user-service:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/user-service
      dockerfile: Dockerfile
    image: nexaai/user-service:0.1.0-SNAPSHOT
    container_name: nexa-user-service
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_user
      SPRING_DATASOURCE_USERNAME: nexa_user
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-nexa_user_local_pw}
      # PUBLIC key only. There is no private-key variable for this service, and
      # adding one would be a privilege escalation: it could then mint a token
      # for itself.
      NEXA_USER_JWT_PUBLIC_KEY: ${NEXA_AUTH_JWT_PUBLIC_KEY:-}
      NEXA_USER_JWT_ISSUER: ${NEXA_AUTH_JWT_ISSUER:-nexa-auth-service}
      NEXA_USER_JWT_AUDIENCE: ${NEXA_AUTH_JWT_AUDIENCE:-nexaai-web}
      NEXA_USER_CONSUMER_GROUP: user-profile-events
      # Off until Subscription Service exists in Phase 9. Until then the admin
      # view reports usage as unavailable rather than as zero.
      NEXA_USER_CLIENT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started

  # ------------------------------------------------------------ api-gateway --
  # The platform's only public entry point. NO DATABASE, NO KAFKA.
  #
  # It receives the RS256 PUBLIC key and has no signing key, so it cannot issue
  # a token. It contains no business logic: it authenticates, applies edge
  # policy and routes.
  api-gateway:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
    image: nexaai/api-gateway:0.1.0-SNAPSHOT
    container_name: nexa-api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      NEXA_GATEWAY_JWT_PUBLIC_KEY: ${NEXA_AUTH_JWT_PUBLIC_KEY:-}
      NEXA_GATEWAY_JWT_ISSUER: ${NEXA_AUTH_JWT_ISSUER:-nexa-auth-service}
      NEXA_GATEWAY_JWT_AUDIENCE: ${NEXA_AUTH_JWT_AUDIENCE:-nexaai-web}
      # Upstream addresses.
      NEXA_AUTH_SERVICE_URL: http://auth-service:8081
      NEXA_USER_SERVICE_URL: http://user-service:8082
      # CORS has NO wildcard default: an empty list stops the gateway at startup.
      # Defaulting to '*' publishes a browser-readable API to every origin.
      NEXA_GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS: ${NEXA_GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:5173}
      NEXA_GATEWAY_CORS_ALLOW_CREDENTIALS: "true"
    # NO depends_on postgres: this service has no database and must never be
    # given one. A gateway with a datasource is a gateway that will be tempted
    # to read somebody else's tables.
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started

  # ---------------------------------------------------------- chat-service --
  # Owns nexa_chat and nothing else. Conversations, messages, history, feedback.
  #
  # NO KAFKA DEPENDENCY as a hard requirement: the listener bean only exists
  # when NEXA_CHAT_EVENT_ENABLED is true, so the service starts and serves with
  # no broker. Depends on postgres only, because that it genuinely cannot work
  # without.
  chat-service:
    <<: *service-defaults
    profiles: [backend]
    build:
      context: ../backend/chat-service
      dockerfile: Dockerfile
    image: nexaai/chat-service:0.1.0-SNAPSHOT
    container_name: nexa-chat-service
    ports:
      - "${CHAT_SERVICE_PORT:-8083}:8083"
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_chat
      SPRING_DATASOURCE_USERNAME: nexa_chat
      SPRING_DATASOURCE_PASSWORD: ${CHAT_DB_PASSWORD:-nexa_chat_local_pw}
      # PUBLIC key only. No private-key variable exists for this service, and
      # adding one would be a privilege escalation.
      NEXA_CHAT_JWT_PUBLIC_KEY: ${NEXA_AUTH_JWT_PUBLIC_KEY:-}
      NEXA_CHAT_JWT_ISSUER: ${NEXA_AUTH_JWT_ISSUER:-nexa-auth-service}
      NEXA_CHAT_JWT_AUDIENCE: ${NEXA_AUTH_JWT_AUDIENCE:-nexaai-web}
      # OFF: there is no AI Service yet, so a sent message leaves a PENDING
      # placeholder rather than a fabricated reply or a false error.
      NEXA_CHAT_GENERATION_ENABLED: "false"
      NEXA_CHAT_EVENT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # EDGE PROXY
  # ===========================================================================
  #
  # Optional. NGINX with the rate-limit zones and security headers from
  # infrastructure/docker/nginx/nexaai.conf, for exercising the real ingress path.
  #
  # The `api-gateway` upstream now resolves, so this can start alongside it.
  edge:
    profiles: [edge]
    image: nginx:1.27-alpine
    container_name: nexa-edge
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8089}:80"
    volumes:
      - ./docker/nginx/nexaai.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [nexa-internal]