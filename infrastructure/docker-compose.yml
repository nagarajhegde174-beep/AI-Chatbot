# =====================================================================
# NexaAI local development infrastructure.
#
#   docker compose --profile infra up -d      infrastructure only
#   docker compose up -d                      everything that exists
#
# =====================================================================
#  PHASE 0 SCOPE.
#
#  This file starts PostgreSQL, Redis and Kafka, plus an optional NGINX edge.
#  It does NOT define the eight backend services, because none of them exist
#  yet. Each service is added here in its own phase, built from its own
#  directory.
#
#  Those service entries are intentionally absent rather than present and
#  commented out. A commented service block looks like configuration, and the
#  first person to uncomment it would be running an image that does not exist.
#  See docs/RULES.md section 10.
# =====================================================================
#
# ARCHITECTURE, not a monolith: every backend entry that gets added here is a
# separate image built from its own directory, with its own port and its own
# database credentials.
#
# There is NO ZooKeeper service in this file, and there must never be one.
# Kafka runs in KRaft mode. ZooKeeper is prohibited by docs/RULES.md section 4.
# =====================================================================

name: nexaai

networks:
  # Internal network. Nothing is published except where a port mapping
  # explicitly says so, and those exist for local development only.
  nexa-internal:
    driver: bridge

volumes:
  nexa-postgres-data:
  nexa-redis-data:
  nexa-kafka-data:

# ---------------------------------------------------------------------
# Shared service defaults.
#
# This extension field holds NO secrets and NO database credentials: it is only
# the shared bootstrap address, so the Kafka and Redis endpoints are written
# once. Every service overrides `environment` with its own values, adding only
# what it needs.
# ---------------------------------------------------------------------
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [nexa-internal]

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: local
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-infra-depends: &infra-depends
  kafka:
    condition: service_healthy

services:
  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  # ---------------------------------------------------------------- postgres --
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-nexa_admin_local_pw}
      POSTGRES_DB: nexa_admin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexa-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/verify:/verify:ro
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      # Makes a missing index obvious during development rather than weeks later.
      - -c
      - log_min_duration_statement=200
      - -c
      - log_duration=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa_admin -d nexa_admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [nexa-internal]

  # ------------------------------------------------------------------- redis --
  # Cache, rate-limit counters, denylist, short-lived locks. Never the system of
  # record, so persistence is deliberately off.
  redis:
    image: redis:7-alpine
    container_name: nexa-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [nexa-internal]

  # ------------------------------------------------------------------- kafka --
  # KRaft mode. The broker is its own controller.
  #
  # There is NO ZooKeeper service in this file, and there must never be one.
  # ZooKeeper is prohibited by docs/RULES.md section 4. Adding a zookeeper
  # service here must fail the build.
  kafka:
    image: apache/kafka:4.1.0
    container_name: nexa-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: "1"
      # A combined broker+controller node: the recommended single-node KRaft setup.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Internal listener for services, external listener for host tooling only.
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      # Single-node development values. These MUST be raised in a real deployment;
      # see infrastructure/docker/kafka/README.md and docs/SECURITY.md section 13.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - nexa-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [nexa-internal]

  # ===========================================================================
  # BACKEND MICROSERVICES
  # ===========================================================================

  api-gateway:
    <<: *service-defaults
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
    container_name: nexa-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *service-env
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CHAT_SERVICE_URL: http://chat-service:8083
      AI_SERVICE_URL: http://ai-service:8084
      DOCUMENT_SERVICE_URL: http://document-service:8085
      RAG_SERVICE_URL: http://rag-service:8086
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8087
      ANALYTICS_SERVICE_URL: http://analytics-service:8088
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  auth-service:
    <<: *service-defaults
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    container_name: nexa-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      <<: *service-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: nexa_auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-nexa_auth_local_pw}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  user-service:
    <<: *service-defaults
    build:
      context: ../backend/user-service
      dockerfile: Dockerfile
    container_name: nexa-user-service
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    environment:
      <<: *service-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: nexa_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-nexa_user_local_pw}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  chat-service:
    <<: *service-defaults
    build:
      context: ../backend/chat-service
      dockerfile: Dockerfile
    container_name: nexa-chat-service
    ports:
      - "${CHAT_SERVICE_PORT:-8083}:8083"
    environment:
      <<: *service-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: nexa_chat
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-nexa_chat_local_pw}
      AI_SERVICE_URL: http://ai-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ai-service:
    <<: *service-defaults
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile
    container_name: nexa-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8084}:8084"
    environment:
      <<: *service-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-disabled}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  document-service:
    <<: *service-defaults
    build:
      context: ../backend/document-service
      dockerfile: Dockerfile
    container_name: nexa-document-service
    ports:
      - "${DOCUMENT_SERVICE_PORT:-8085}:8085"
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexa_document
      DB_PASSWORD: ${DOCUMENT_DB_PASSWORD:-nexa_document_local_pw}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  rag-service:
    <<: *service-defaults
    build:
      context: ../backend/rag-service
      dockerfile: Dockerfile
    container_name: nexa-rag-service
    ports:
      - "${RAG_SERVICE_PORT:-8086}:8086"
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexa_rag
      DB_PASSWORD: ${RAG_DB_PASSWORD:-nexa_rag_local_pw}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  subscription-service:
    <<: *service-defaults
    build:
      context: ../backend/subscription-service
      dockerfile: Dockerfile
    container_name: nexa-subscription-service
    ports:
      - "${SUBSCRIPTION_SERVICE_PORT:-8087}:8087"
    environment:
      <<: *service-env
      RAZORPAY_KEY_ID: ${RAZORPAY_TEST_KEY_ID:-rzp_test_nexaai_default}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_TEST_KEY_SECRET:-rzp_test_secret_default}
    depends_on:
      kafka:
        condition: service_healthy

  analytics-service:
    <<: *service-defaults
    build:
      context: ../backend/analytics-service
      dockerfile: Dockerfile
    container_name: nexa-analytics-service
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8088}:8088"
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexa_analytics
      DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-nexa_analytics_local_pw}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ===========================================================================
  # FRONTEND
  # ===========================================================================

  frontend:
    <<: *service-defaults
    build:
      context: ../frontend/nexa-ai-web
      dockerfile: Dockerfile
    container_name: nexa-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api-gateway

  # ===========================================================================
  # EDGE PROXY (NGINX)
  # ===========================================================================
  edge:
    image: nginx:1.27-alpine
    container_name: nexa-edge
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8089}:80"
    volumes:
      - ./docker/nginx/nexaai.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
      - frontend
    networks: [nexa-internal]