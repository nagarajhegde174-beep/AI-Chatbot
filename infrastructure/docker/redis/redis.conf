# Redis for NexaAI local development.
#
# Redis is a CACHE, rate-limit counter store, denylist and short-lived lock
# holder. It is never the system of record. Losing every key must degrade
# performance, never correctness -- see docs/RULES.md section 7.1.
#
# There is deliberately no AOF and no RDB persistence enabled: if Redis holds
# nothing that cannot be rebuilt, persisting it would only hide a design error.

bind 0.0.0.0
port 6379

# No authentication locally, because the port is published only to the host
# and never exposed to the outside world. Any real deployment must set a
# password or a TLS connection, injected from the environment.
# requirepass nexa_redis_local_pw

# --- persistence off: everything here is reconstructible -------------------
save ""
appendonly no

# --- memory ---------------------------------------------------------------
# Cap memory so a leak cannot take the host down, and fail loudly instead of
# silently evicting the wrong key.
maxmemory 512mb
maxmemory-policy allkeys-lru

# --- connections ----------------------------------------------------------
maxclients 10000
timeout 0
tcp-keepalive 300

# --- slow command logging -------------------------------------------------
# A slow Redis command is a design smell, so it is logged rather than ignored.
slowlog-log-slower-than 100
slowlog-max-len 256

# --- keyspace notifications are not used -----------------------------------
# Services that need invalidation consume the Kafka event that caused it,
# rather than depending on a Redis pub/sub channel that would add a second
# message bus to reason about.

loglevel notice
