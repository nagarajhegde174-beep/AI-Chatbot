# =====================================================================
# NGINX edge configuration for NexaAI local development.
#
# Two jobs:
#   1. serve the built frontend as static files
#   2. be the single public entry point that proxies /api to the API Gateway
#
# TLS is terminated here in a real deployment; local development runs plain
# HTTP to keep self-signed certificates out of the way.
#
# STATUS: not yet loaded by NGINX. There was no Docker daemon available when
# Phase 0 was written, so this file has been reviewed but never parsed by the
# server. See docs/MEMORY.md section 6.1.
# =====================================================================
#
# The `upstream api-gateway` below does not resolve until the gateway is
# implemented in Phase 3. NGINX fails to start on an unresolvable upstream, which
# is why the edge service sits behind its own `edge` Compose profile rather than
# the default set.
# =====================================================================

upstream nexa_gateway {
    server api-gateway:8080;
    keepalive 32;
}

# --- rate-limit zones -------------------------------------------------------
# Sized per concern rather than globally, because the concerns have different
# costs and different abuse profiles. See docs/SECURITY.md section 6.
#
#   auth: 10 requests/min per IP   -> login, register, password reset
#   chat: 60 requests/min per IP   -> streamed answers are long-lived
#   api:  300 requests/min per IP  -> everything else
limit_req_zone $binary_remote_addr zone=nexa_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nexa_chat:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=nexa_api:10m  rate=300r/m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded documents are capped by document-service against the user's plan,
    # but NGINX rejects absurd bodies early so a large upload never becomes a
    # slow request that ties up a connection.
    client_max_body_size 25m;
    client_body_timeout 60s;

    # --- security headers ----------------------------------------------------
    # The full set from docs/SECURITY.md section 10, except CSP, which is
    # deliberately deferred to Phase 10. A wrong CSP in Phase 0 would break the
    # application in a way that looks like a bug, and the real policy depends on
    # how Phase 10 builds the frontend.
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                     always;

    # Do not advertise the NGINX version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # =====================================================================
    # API: everything under /api goes to the gateway, and only to the gateway.
    #
    # The frontend must never call a service port directly, so there is no
    # location block here that points at auth-service, chat-service or any other
    # service. One upstream, one place where edge policy lives.
    # =====================================================================
    location /api/ {
        limit_req zone=nexa_api burst=60 nodelay;

        proxy_pass http://nexa_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The gateway generates this when absent; forwarding preserves it.
        proxy_set_header X-Correlation-Id  $http_x_correlation_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- authentication endpoints: stricter limit ---------------------------
    # /api/v1/auth/ also matches the /api/ prefix above. NGINX prefers the
    # longest matching prefix for prefix locations, so this block wins. That is
    # the intent: a stricter limit on credential endpoints, not a duplicate.
    location /api/v1/auth/ {
        limit_req zone=nexa_auth burst=5 nodelay;

        proxy_pass http://nexa_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id  $http_x_correlation_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # =====================================================================
    # Server-Sent Events: streamed chat answers.
    #
    # This block is the difference between a working chat and a broken one. With
    # buffering on, NGINX holds every token until the answer is complete and the
    # user sees nothing, then sees it all at once. Buffering must be off,
    # chunked transfer must stay enabled, and the read timeout must exceed the
    # longest generation a provider can take.
    #
    # A regex location takes priority over prefix locations in NGINX, so this
    # matches before the /api/ block above.
    # =====================================================================
    location ~ ^/api/v1/chat/.*/messages$ {
        limit_req zone=nexa_chat burst=20 nodelay;

        proxy_pass http://nexa_gateway;
        proxy_http_version 1.1;

        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id  $http_x_correlation_id;

        # Stream the response through untouched, token by token.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;

        # A long generation is normal, so a generous ceiling is correct here and
        # only here.
        proxy_connect_timeout 5s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    # --- health, for the compose healthcheck and for operators ---------------
    location = /healthz {
        access_log off;
        proxy_pass http://nexa_gateway/actuator/health;
        proxy_set_header Host $host;
    }

    # --- frontend static assets ----------------------------------------------
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading an old
    # bundle that points at assets which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # --- SPA fallback --------------------------------------------------------
    # Client-side routing: any unknown path that is not an API call and not a
    # real file returns index.html so React Router can resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Internal service endpoints are never reachable from outside. The gateway
    # refuses these too; this is the second, independent lock.
    location ~ ^/(internal|actuator)/ {
        deny all;
        return 404;
    }
}