# =====================================================================
# Frontend CI
#
# Type-check, lint, and produce a real production build. Tailwind is
# prohibited by docs/RULES.md section 5, so that is a hard failure rather than
# a review comment.
#
# The build also proves the Bootstrap + SCSS override pipeline actually compiles,
# which is the one frontend risk worth catching early: it is possible to write a
# correct-looking _theme.scss that never takes effect.
# =====================================================================

name: Frontend

on:
  push:
    branches: [main, phase0]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, phase0]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend/nexa-ai-web

jobs:
  verify:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/nexa-ai-web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # tsc -b runs first inside `npm run build`, so a type error fails the build
      # rather than shipping.
      - name: Type-check and build
        run: npm run build

      - name: Tailwind is prohibited
        run: |
          set -euo pipefail
          if grep -rniE 'tailwind' package.json src/ index.html 2>/dev/null; then
            echo "::error::Tailwind reference found. The frontend must use Bootstrap 5 and SCSS. See docs/RULES.md section 5."
            exit 1
          fi
          node -e "
            const p = require('./package.json');
            const all = { ...p.dependencies, ...p.devDependencies };
            if (!all['bootstrap']) { console.error('::error::bootstrap is not a dependency'); process.exit(1); }
            if (!all['sass'])       { console.error('::error::sass is not a dependency'); process.exit(1); }
            if (all['next'] || all['vue'] || all['@angular/core']) { console.error('::error::prohibited framework present'); process.exit(1); }
            console.log('ok: Bootstrap and Sass present; Tailwind, Next.js, Vue and Angular absent');
          "

      - name: The SCSS pipeline actually produced themed CSS
        run: |
          set -euo pipefail
          # A build can succeed while the theme silently fails to apply. This
          # asserts the theme reached the output bundle, which is the failure
          # mode that would otherwise only be noticed by looking at the page.
          if ! grep -q -- '--nexa-accent' dist/assets/*.css; then
            echo "::error::the design tokens are missing from the built CSS. The theme pipeline did not run. See docs/ARCHITECTURE.md section 9.3."
            exit 1
          fi
          if ! grep -q -- '--bs-body-bg' dist/assets/*.css; then
            echo "::error::Bootstrap variable overrides are missing from the built CSS. See docs/ARCHITECTURE.md section 9.3."
            exit 1
          fi
          echo "ok: the theme reached the built bundle"

      - name: No secrets in the built bundle
        run: |
          set -euo pipefail
          # Vite inlines every VITE_* variable into the bundle, so a credential
          # would be readable by every user in a devtools console.
          if grep -rlIE '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|rzp_(live|test)_[A-Za-z0-9]{10,}|ghp_[A-Za-z0-9]{30,})' dist/ 2>/dev/null; then
            echo "::error::a credential was found in the built bundle. See docs/RULES.md section 6."
            exit 1
          fi
          echo "ok: no credentials in dist/"

      - name: Bundle size against the budget
        run: |
          set -euo pipefail
          # docs/ARCHITECTURE.md section 9.2 budgets INITIAL JavaScript at 200 kB gzip, and
          # caps total JavaScript at 320 kB.
          #
          # WHY THIS IS A SCRIPT AND NOT A ONE-LINE `find | gzip | wc`
          #
          # The previous version summed every .js file in dist/assets and compared the
          # result to the INITIAL budget. That measured a different quantity than the one
          # the budget describes, and it made code-splitting strictly worse: moving code into
          # a chunk changed nothing for the check while genuinely improving the number a
          # user experiences. A check that penalises the technique it is meant to encourage
          # gets satisfied by deleting the feature instead.
          #
          # So it is now two caps, both enforced:
          #   initial - the static import closure of the HTML entry point, from the Vite
          #             manifest. This is what a browser downloads before the page is usable.
          #   total   - every chunk, including ones fetched only on demand. Capped
          #             separately so deferring a dependency is free for first paint but not
          #             free forever.
          #
          # The script also fails loudly if the manifest is missing or declares no entry,
          # rather than reporting a near-zero payload and passing.
          node scripts/check-bundle-budget.mjs

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: nexa-ai-web-dist
          path: frontend/nexa-ai-web/dist/
          if-no-files-found: error
          retention-days: 7