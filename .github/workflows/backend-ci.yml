# Backend CI
#
# ONE JOB PER SERVICE, AND THAT IS THE POINT.
#
# Each job builds only its own service directory, with no aggregator POM and no
# sibling services checked out. If a service could only build as part of the
# whole repository, it would not be a genuine microservice, and this workflow
# is what makes that failure visible instead of theoretical.
#
# Also enforced here, as hard rules rather than review comments:
#   - exactly one @SpringBootApplication per service
#   - no service POM depending on another NexaAI service
#   - no service config naming another service's database
#   - no ZooKeeper anywhere
#   - no committed secret
#
# See docs/RULES.md.

name: Backend CI

on:
  push:
    branches: [main, foundation]
  pull_request:
    branches: [main, foundation]
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp

jobs:
  # ==========================================================================
  # Rule checks, once per push. Fast, and they fail before eight JVMs start.
  # ==========================================================================
  architecture-rules:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rule 1 - exactly one Spring Boot application per service
        run: |
          set -euo pipefail
          services="api-gateway auth-service user-service chat-service ai-service document-service rag-service subscription-service"
          for s in $services; do
            count=$(grep -rl "@SpringBootApplication" "backend/$s/src" 2>/dev/null | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::$s must contain exactly one @SpringBootApplication, found $count"
              exit 1
            fi
            echo "ok: $s has exactly one main class"
          done

      - name: Rule 1b - each service has its own pom, port, config, tests and Dockerfile
        run: |
          set -euo pipefail
          services="api-gateway auth-service user-service chat-service ai-service document-service rag-service subscription-service"
          for s in $services; do
            for required in "backend/$s/pom.xml" "backend/$s/Dockerfile" "backend/$s/README.md"; do
              [ -f "$required" ] || { echo "::error::missing $required"; exit 1; }
            done
            [ -f "backend/$s/src/main/resources/application.yml" ] \
              || { echo "::error::$s has no application.yml"; exit 1; }
            [ -d "backend/$s/src/test" ] \
              || { echo "::error::$s has no tests of its own"; exit 1; }
            grep -q "server:" "backend/$s/src/main/resources/application.yml" \
              || { echo "::error::$s does not declare its own port"; exit 1; }
          done
          echo "ok: all eight services are self-contained"

      - name: Rule 2 - no service depends on another service
        run: |
          set -euo pipefail
          services="api-gateway auth-service user-service chat-service ai-service document-service rag-service subscription-service"
          for s in $services; do
            for other in $services; do
              if [ "$other" = "$s" ]; then continue; fi
              if grep -q "<artifactId>$other</artifactId>" "backend/$s/pom.xml"; then
                echo "::error::$s/pom.xml declares a dependency on $other. Shared library and cross-service modules are prohibited by docs/RULES.md section 2."
                exit 1
              fi
            done
          done
          echo "ok: no service depends on another service"

      - name: Rule 2b - no aggregator POM and no shared library module
        run: |
          set -euo pipefail
          # Each service's parent is spring-boot-starter-parent from Maven Central,
          # never a POM inside this repository.
          for p in backend/*/pom.xml; do
            svc=$(basename "$(dirname "$p")")
            if grep -A2 "<parent>" "$p" | grep -q "<relativePath>"; then
              echo "::error::$svc has a <relativePath> parent, which means it inherits from a POM inside this repository. That is a shared module. See docs/RULES.md section 2."
              exit 1
            fi
            if grep -q "<modules>" "$p"; then
              echo "::error::$svc is an aggregator POM. The backend must be eight independent applications."
              exit 1
            fi
          done
          echo "ok: every service is built independently"

      - name: Rule 3 - no service references another service's database
        run: |
          set -euo pipefail
          # A service may name its OWN database and must never name another's.
          # The set of database names in a service's sources must be either empty
          # (api-gateway, ai-service) or exactly one: its own.
          declare -A owner=(
            [nexa_auth]=auth-service
            [nexa_user]=user-service
            [nexa_chat]=chat-service
            [nexa_document]=document-service
            [nexa_rag]=rag-service
            [nexa_subscription]=subscription-service
          )
          pattern='nexa_(auth|user|chat|document|rag|subscription)'
          for db in "${!owner[@]}"; do
            svc="${owner[$db]}"
            found=$(grep -rhoE "$pattern" "backend/$svc" \
                     --include='*.yml' --include='*.yaml' --include='*.java' \
                     --include='*.xml' --include='*.sql' 2>/dev/null | sort -u || true)
            [ -z "$found" ] && continue
            if [ "$found" != "$db" ]; then
              echo "::error::$svc references a database it does not own."
              echo "::error::found: $(echo "$found" | tr '\n' ' ')  expected only: $db"
              exit 1
            fi
          done
          echo "ok: each service names only its own database"

      - name: Rule 3b - the AI service and the gateway are database-free
        run: |
          set -euo pipefail
          for s in ai-service api-gateway; do
            # Match real configuration and real code, not prose. A comment saying
            # "this service has no datasource" must not fail the check, so YAML
            # comment lines are filtered out and Java/XML comment lines are too.
            if grep -rniE 'datasource|spring\.jdbc|flyway' "backend/$s" \
                 --include='*.yml' --include='*.yaml' --include='*.java' \
                 --include='*.xml' 2>/dev/null \
               | grep -vE ':[0-9]+:[[:space:]]*(#|//|\*|<!--)' \
               | grep -vE 'README\.md' \
               | grep -qE '.' ; then
              echo "::error::$s must not have a database. It is stateless by design. See docs/ARCHITECTURE.md section 3.1."
              grep -rniE 'datasource|spring\.jdbc|flyway' "backend/$s" \
                --include='*.yml' --include='*.yaml' --include='*.java' \
                --include='*.xml' 2>/dev/null \
                | grep -vE ':[0-9]+:[[:space:]]*(#|//|\*|<!--)' | head -5
              exit 1
            fi
            # No persistence starter may be declared either.
            if grep -qE 'spring-boot-starter-data-jpa|spring-boot-starter-jdbc|flyway-core' \
                 "backend/$s/pom.xml"; then
              echo "::error::$s declares a persistence starter but must be database-free."
              exit 1
            fi
          done
          echo "ok: ai-service and api-gateway are database-free"

      - name: Rule 4 - ZooKeeper is prohibited
        run: |
          set -euo pipefail
          # Comments and prose are allowed to SAY "ZooKeeper" in order to forbid
          # it, and the most valuable place for that comment is exactly where a
          # ZooKeeper service would be added. So comment lines and markdown are
          # filtered out; configuration and source code are not.
          strip_comments() { grep -vE ':[0-9]+:[[:space:]]*(#|//|\*|<!--)'; }

          if grep -rniI --exclude-dir=docs --exclude-dir=target --exclude-dir=node_modules \
               --exclude-dir=.git --exclude-dir=workflows --exclude='*.md' "zookeeper" . \
               | strip_comments | grep -q . ; then
            echo "::error::ZooKeeper reference found in code or configuration. KRaft only. See docs/RULES.md section 4."
            grep -rniI --exclude-dir=docs --exclude-dir=target --exclude-dir=node_modules \
                 --exclude-dir=.git --exclude-dir=workflows --exclude='*.md' "zookeeper" . \
               | strip_comments | head -5
            exit 1
          fi

          # Belt and braces: a ZooKeeper service would realistically be added to
          # a compose file, so those are checked explicitly.
          if grep -rniI "zookeeper" --include='*.yml' --include='*.yaml' \
               --include='Dockerfile*' infrastructure/ | strip_comments | grep -q . ; then
            echo "::error::ZooKeeper found in infrastructure configuration."
            exit 1
          fi

          # A ZooKeeper service container in CI would also be a violation. This
          # check is deliberately specific to image and service declarations,
          # because this workflow must be able to NAME the rule it enforces.
          if grep -rniIE '(image|services):[^\n]*zookeeper|zookeeper:[0-9]' .github/ \
               | strip_comments | grep -q . ; then
            echo "::error::a ZooKeeper image or service container appears in a CI workflow."
            exit 1
          fi
          echo "ok: no ZooKeeper"

      - name: Rule 4b - Kafka must be in KRaft mode
        run: |
          set -euo pipefail
          grep -q "KAFKA_PROCESS_ROLES" infrastructure/docker-compose.yml \
            || { echo "::error::Kafka is not configured in KRaft mode"; exit 1; }
          grep -q "KAFKA_CONTROLLER_QUORUM_VOTERS" infrastructure/docker-compose.yml \
            || { echo "::error::Kafka controller quorum is not configured"; exit 1; }
          echo "ok: Kafka is in KRaft mode"

      - name: Rule 5 - Tailwind is prohibited
        run: |
          set -euo pipefail
          if [ -f frontend/nexa-ai-web/package.json ]; then
            if grep -ni 'tailwind' frontend/nexa-ai-web/package.json ; then
              echo "::error::Tailwind is present in the frontend. Bootstrap 5 and SCSS only. See docs/RULES.md section 5."
              exit 1
            fi
            # Bootstrap and Sass must actually be wired, not merely Tailwind-free.
            node -e "
              const p = require('./frontend/nexa-ai-web/package.json');
              const all = { ...(p.dependencies||{}), ...(p.devDependencies||{}) };
              const missing = ['bootstrap','sass'].filter(d => !all[d]);
              if (missing.length) { console.error('::error::missing frontend dependency: ' + missing.join(', ')); process.exit(1); }
              console.log('ok: bootstrap and sass present, tailwind absent');
            "
          fi
          if [ -d frontend/nexa-ai-web/src ] && grep -rniE '@tailwind|tailwind\.config' frontend/nexa-ai-web/src ; then
            echo "::error::Tailwind directive found in frontend styles."
            exit 1
          fi

      - name: Rule 6 - no secrets in source
        run: |
          set -euo pipefail
          # Nothing that looks like a live provider or payment credential. This
          # workflow file is excluded because the patterns below must be written
          # out literally in order to search for them.
          if grep -rniIE --exclude-dir=target --exclude-dir=node_modules --exclude-dir=.git \
               --exclude-dir=workflows --exclude='*.example' --exclude='*.md' \
               '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|rzp_live_[A-Za-z0-9]{10,}|ghp_[A-Za-z0-9]{30,})' . ; then
            echo "::error::a credential-shaped string is committed. See docs/RULES.md section 6."
            exit 1
          fi
          # No .env file may be tracked; only .env.example may.
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "::error::a .env file is tracked. Only .env.example is allowed."
            exit 1
          fi
          # Every .env.example must be free of real values: only placeholders.
          for f in $(git ls-files | grep -E '\.env\.example$' || true); do
            if grep -nE '^[A-Z0-9_]+=.+$' "$f" | grep -viE '=($|localhost|http://|127\.0\.0\.1)' ; then
              echo "::error::$f appears to contain a real value. Only empty placeholders are allowed."
              exit 1
            fi
          done
          echo "ok: no committed secrets"

      - name: Compose file is valid
        run: docker compose -f infrastructure/docker-compose.yml config --quiet

  # ==========================================================================
  # One independent build-and-test job per service.
  # ==========================================================================
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Report every service's result instead of stopping at the first failure,
      # so one broken service does not hide the state of the other seven.
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - chat-service
          - ai-service
          - document-service
          - rag-service
          - subscription-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify (compile, test, package)
        working-directory: backend/${{ matrix.service }}
        run: mvn $MAVEN_ARGS clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the packaged jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/*.jar
          if-no-files-found: error
          retention-days: 7
