# =====================================================================
# Backend CI
#
# PHASE-AWARE BY DESIGN. See docs/ARCHITECTURE.md decision 016.
#
# This workflow discovers which services actually have a pom.xml and builds
# exactly those, one job per service, each in its own working directory with no
# aggregator POM and no sibling services on the classpath. That is the
# microservices test: if a service could only build as part of the whole
# repository, it is not genuinely independent, and this workflow is what makes
# that failure visible instead of theoretical.
#
# It does NOT:
#   - require a future service to compile
#   - build a Docker image for a service that has no Dockerfile
#   - skip, retry or pass a broken service
#
# In Phase 0 the discovered set is empty. This workflow then says so explicitly
# in its output and in the job summary. It does NOT report a pass that implies
# application code was verified. A green pipeline that skipped the real work is
# worse than a red one. See docs/RULES.md section 11.
# =====================================================================

name: Backend

on:
  push:
    branches: [main, phase0]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, phase0]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Discovery. Runs first, so the build matrix reflects reality rather than a
  # hardcoded list of eight services that do not exist yet.
  # ==========================================================================
  discover:
    name: Discover implemented services
    runs-on: ubuntu-latest
    outputs:
      # Newline-separated list. Empty string when nothing is implemented.
      services: ${{ steps.find.outputs.services }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        run: |
          set -euo pipefail
          services="api-gateway auth-service user-service chat-service ai-service document-service rag-service subscription-service"
          found=""
          for s in $services; do
            if [ -f "backend/$s/pom.xml" ]; then
              found="${found}${s}\n"
            fi
          done
          count=$(printf '%b' "$found" | grep -c . || true)
          {
            echo "services<<EOF"
            printf '%b' "$found"
            echo "EOF"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"
          echo "Discovered $count implemented service(s) of 8."

  # ==========================================================================
  # One independent build-and-test job per implemented service.
  # ==========================================================================
  build:
    name: build ${{ matrix.service }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      # Report every service's result rather than stopping at the first
      # failure, so one broken service does not hide the state of the others.
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services || '[]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Phase 1 pins the Spring Boot and Spring AI versions. Until a POM exists
      # there is no version to check, so this step only asserts once a POM does.
      - name: Fail fast on a broken POM
        working-directory: backend/${{ matrix.service }}
        run: mvn -B -ntp help:effective-pom -Doutput=target/effective-pom.xml -q

      - name: Verify (compile, test, package)
        working-directory: backend/${{ matrix.service }}
        run: mvn -B -ntp clean verify

      - name: No test was silently skipped
        working-directory: backend/${{ matrix.service }}
        run: |
          set -euo pipefail
          # A disabled test suite is a green pipeline with nothing behind it.
          # See docs/RULES.md section 11.
          if grep -rn '@Disabled\|@Ignore' src/test --include='*.java' 2>/dev/null; then
            echo "::error::${{ matrix.service }} contains a disabled test. Tests are not switched off to make a build pass."
            exit 1
          fi
          if [ ! -d src/test ]; then
            echo "::error::${{ matrix.service }} has no tests of its own."
            exit 1
          fi
          echo "ok: no disabled tests"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the packaged jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/*.jar
          if-no-files-found: error
          retention-days: 7

  # ==========================================================================
  # Honest reporting when nothing is implemented yet.
  # ==========================================================================
  not-implemented:
    name: No services implemented yet
    needs: discover
    if: needs.discover.outputs.count == '0'
    runs-on: ubuntu-latest
    steps:
      - name: State plainly that no application code was built or tested
        run: |
          set -euo pipefail
          echo "############################################################"
          echo "# BACKEND: 0 of 8 services implemented."
          echo "#"
          echo "# No Maven build ran, because no pom.xml exists in any service"
          echo "# directory. That is the intended Phase 0 state: architecture"
          echo "# and documentation are established, and no business code is"
          echo "# written ahead of its phase."
          echo "#"
          echo "# See docs/RULES.md section 10 and docs/ARCHITECTURE.md decision 015."
          echo "#"
          echo "# This job is NOT a pass on application code. It is an honest"
          echo "# statement that there is none to test. See docs/RULES.md s.11."
          echo "############################################################"
          {
            echo ""
            echo "> **Backend: nothing to build.** All eight service directories exist and are"
            echo "> documented, and none has a \`pom.xml\`, because Phase 0 deliberately"
            echo "> implements no service (docs/RULES.md section 10). No Maven build ran and no"
            echo "> application code was tested. This is a documented state, not a skipped check."
            echo ">"
            echo "> The build job activates automatically as each service is implemented,"
            echo "> starting with \`auth-service\` in Phase 1."
          } >> "$GITHUB_STEP_SUMMARY"