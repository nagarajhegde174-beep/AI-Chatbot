# Frontend CI
#
# Type-check, lint, and produce a real production build. Tailwind is prohibited
# by docs/RULES.md section 5, so the check below is a hard build failure rather
# than a review comment.
#
# The build also proves that the Bootstrap + SCSS override pipeline actually
# compiles, which is the one frontend risk worth catching early.

name: Frontend CI

on:
  push:
    branches: [main, foundation]
  paths:
    - 'frontend/**'
    - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, foundation]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend/nexa-ai-web

jobs:
  verify:
    name: Type-check, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/nexa-ai-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b runs inside `npm run build` and runs first, so a type error
      # fails the build rather than shipping.
      - name: Type-check and build
        run: npm run build

      - name: Tailwind is prohibited
        run: |
          set -euo pipefail
          if grep -rniE 'tailwind' package.json src/ index.html 2>/dev/null; then
            echo "::error::Tailwind reference found. The frontend must use Bootstrap 5 and SCSS. See docs/RULES.md section 5."
            exit 1
          fi
          # Bootstrap and Sass must be present, or the design system is not wired.
          node -e "
            const p = require('./package.json');
            const all = { ...p.dependencies, ...p.devDependencies };
            if (!all['bootstrap']) { console.error('::error::bootstrap is not a dependency'); process.exit(1); }
            if (!all['sass'])       { console.error('::error::sass is not a dependency'); process.exit(1); }
            console.log('ok: Bootstrap and Sass are present, Tailwind is absent');
          "

      - name: No secrets in the frontend bundle
        run: |
          set -euo pipefail
          # Vite inlines every VITE_* variable into the bundle, so a credential
          # must never appear in the source or in the build output.
          if grep -rniIE --exclude='*.example' \
               '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|rzp_(live|test)_[A-Za-z0-9]{10,})' \
               src/ .env* 2>/dev/null; then
            echo "::error::credential-shaped string in frontend source. See docs/RULES.md section 6."
            exit 1
          fi
          if [ -d dist ]; then
            if grep -rlIE '(sk-[A-Za-z0-9]{20,}|rzp_live_[A-Za-z0-9]{10,})' dist/ 2>/dev/null; then
              echo "::error::credential found in the built bundle"
              exit 1
            fi
          fi
          echo "ok: no secrets in the frontend"

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: nexa-ai-web-dist
          path: frontend/nexa-ai-web/dist/
          if-no-files-found: error
          retention-days: 7
